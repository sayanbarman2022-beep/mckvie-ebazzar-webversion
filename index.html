<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCKVIE Campus Bazaar</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="font-sans text-gray-800 antialiased m-0 p-0 bg-slate-50 min-h-screen">

    <div class="engineering-grid"></div>

    <!-- Navigation Header -->
    <nav class="bg-blue-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-graduation-cap text-yellow-400 text-2xl"></i>
                <span class="text-2xl font-bold tracking-wider">MCKVIE<span class="text-yellow-400">Bazaar</span></span>
            </div>
            
            <div class="w-full md:w-1/3 flex shadow-sm rounded-md overflow-hidden">
                <input type="text" id="searchInput" placeholder="Search lab coats, notes, drafters..." class="w-full px-4 py-2 text-gray-900 focus:outline-none text-sm">
                <button class="bg-yellow-400 text-gray-900 px-5 font-bold hover:bg-yellow-500 transition-colors">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <!-- Auth & Action Controls -->
            <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                <div id="authContainer"></div>
                <button onclick="toggleModal(true)" class="bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold px-5 py-2 rounded-md transition shadow-md flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-camera"></i>
                    <span>Post Ad</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 flex items-center">
                <i class="fa-solid fa-box-open mr-2 text-blue-600"></i>Available Gear
            </h2>
            
            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                <select id="categoryFilter" class="border border-gray-300 p-2 rounded-md bg-gray-50 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="all">All Categories</option>
                    <option value="Drawing Kit">Drawing Kits</option>
                    <option value="Lab Coat">Lab Coats</option>
                    <option value="Notes">Notes / Books</option>
                    <option value="Electronics">Electronics</option>
                </select>
                
                <select id="sortFilter" class="border border-gray-300 p-2 rounded-md bg-gray-50 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="newest">Sort by: Newest First</option>
                    <option value="priceLow">Price: Low to High</option>
                    <option value="priceHigh">Price: High to Low</option>
                </select>
            </div>
        </div>

        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>

    <!-- User Login & Registration Modal -->
    <div id="authModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="toggleAuthModal(false)" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 text-xl transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-2xl font-bold text-gray-900 mb-1">Student Account</h3>
            <p class="text-xs text-gray-500 mb-5">Login or sign up to buy and post items</p>

            <form id="authForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Email / Student ID</label>
                    <input type="email" id="authEmail" required placeholder="student@mckvie.edu.in" class="w-full border border-gray-300 rounded-md p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <!-- Device Storage Profile Picture Upload Option -->
                <div class="bg-blue-50/70 p-3 rounded-lg border border-blue-100">
                    <label class="block text-sm font-bold text-blue-900 mb-1">
                        <i class="fa-solid fa-user-gear mr-1"></i> Profile Picture
                    </label>
                    <input type="file" id="authAvatarFile" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
                    <div id="avatarPreviewContainer" class="hidden mt-2 flex items-center gap-2">
                        <img id="avatarPreview" src="" class="w-10 h-10 rounded-full object-cover border-2 border-blue-600">
                        <span class="text-xs text-green-700 font-medium"><i class="fa-solid fa-circle-check"></i> Image selected</span>
                    </div>
                </div>

                <button type="submit" id="authSubmitBtn" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-2.5 rounded-md transition shadow flex items-center justify-center">
                    Login / Continue
                </button>
            </form>
        </div>
    </div>

    <!-- Post Ad Modal -->
    <div id="sellModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="toggleModal(false)" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 text-2xl transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <h3 class="text-2xl font-bold text-gray-900 mb-6 border-b pb-2">Sell Your Gear</h3>
            
            <form id="sellForm" class="space-y-4">
                <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <label class="block text-sm font-bold text-gray-800 mb-2"><i class="fa-solid fa-camera mr-1"></i> Product Photo (Required)</label>
                    <input type="file" id="itemImage" accept="image/*" capture="environment" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700">Ad Title</label>
                    <input type="text" id="itemTitle" required class="mt-1 w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Category</label>
                        <select id="itemCategory" class="mt-1 w-full border border-gray-300 rounded-md p-2">
                            <option>Drawing Kit</option>
                            <option>Lab Coat</option>
                            <option>Notes</option>
                            <option>Electronics</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Price (₹)</label>
                        <input type="number" id="itemPrice" min="0" required class="mt-1 w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700">Condition & Details</label>
                    <textarea id="itemDesc" rows="2" required class="mt-1 w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                    <label class="block text-sm font-bold text-blue-800 mb-1"><i class="fa-solid fa-map-pin mr-1"></i> MCKVIE Handover Point</label>
                    <select id="itemLocation" class="w-full border border-blue-200 rounded-md p-2 outline-none">
                        <option>Central Library (Ground Floor)</option>
                        <option>College Canteen</option>
                        <option>Main Gate / Reception Area</option>
                        <option>Mechanical Workshop</option>
                        <option>1st Year Common Room</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700">Contact Number</label>
                    <input type="tel" id="itemContact" required placeholder="10-digit mobile" pattern="[0-9]{10}" class="mt-1 w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-md transition shadow-md mt-4 flex justify-center items-center">
                    Post to Bazaar
                </button>
            </form>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 flex flex-col gap-2 z-50"></div>

    <!-- Application Script -->
    <script src="script.js" defer></script>
</body>
</html>
